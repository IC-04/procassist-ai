[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procmine"
version = "0.1.0"
description = "Reconstruct business-process executions from desktop operation logs."
requires-python = ">=3.10"

# docs/ARCHITECTURE.md §6; a new dependency needs an ADR (CLAUDE.md §7).
#
# These are REQUIRED, not optional. The note that used to sit here — "none of
# pandas/numpy/networkx is imported anywhere in procmine/" — was true in Phase 0 and became
# false at ADR-021, when the shipped identity method became a graph method. Leaving them
# nominally optional caused the S-E9 incident: on a host where the venv did not resolve,
# `make run-b` fell through to an ambient interpreter without networkx or rapidfuzz, the
# labeller caught the ImportError, and a DIFFERENT deliverable shipped with exit code 0 —
# identical spans, 33 labels instead of 13. `label.missing_graph_dependencies()` now refuses
# to run in that state, and these are declared as hard requirements to match.
dependencies = [
    "pandas",
    "numpy",          # every similarity matrix                  (identity.*)
    "scipy",          # sparse feature stacking                  (identity.vector_space)
    "networkx",       # kNN graph + Louvain, THE shipped method  (identity.louvain)
    "scikit-learn",   # ARI/NMI/homogeneity/completeness, TF-IDF (evaluate, identity)
    "segeval",        # WindowDiff / Pk                          (evaluate.windowdiff, .pk)
    "rapidfuzz",      # sequence distance over surface shapes    (identity._seq_similarity)
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
procmine = "procmine.cli:main"

[tool.setuptools.packages.find]
include = ["procmine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the full Step 1 chain over a dataset (deliverable reproducibility)",
]
